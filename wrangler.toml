# :schema node_modules/wrangler/config-schema.json
#
# Cloudflare Workers configuration for New Galaxy Furniture.
#
# Production targets the verified company account. Build with DEPLOY_TARGET=cloudflare.
# D1 and KV identifiers below belong to that account. Verify R2 activation and bucket
# creation, private secret setup, and deployment before declaring the application live.
# The workers.dev hostname is temporary until the custom domain is owned and connected.
#
# GITHUB_REPO/GITHUB_BRANCH are non-secret vars. Supply GITHUB_TOKEN and SESSION_SECRET
# privately; never put credential values in this file. Upload them with the application:
#   wrangler deploy --config dist/server/wrangler.json --secrets-file .wrangler/company-repository-secrets.json
# Routine deployment uses `npm run deploy:cloudflare` and preserves installed secrets.
# Ordinary `secret put` deploys immediately; do not use it for staging.
# AI and deployment-status integrations remain unset without valid credentials.
# Preview IDs are deliberately invalid until company preview resources are provisioned.
#
# NOTE ON RATE LIMITING: unlike the original Cloudflare design, the current application collapses the
# per-minute ceilings into KV counters (`consumeBindingLimit` in src/lib/auth/rate-limit.ts), so
# there are intentionally NO [[ratelimits]] bindings here. The RATELIMIT KV namespace covers every
# window.

name = "newgalaxyfurniture"
account_id = "202e4307d4836b9170f546dbea1783d4"
# `main` points at the project's Worker entry (the fetch handler + the scheduled analytics handler).
# Under @astrojs/cloudflare v14 the adapter injects its own entrypoint when `main` is unset; naming a
# real source file is the supported override for adding the `scheduled` export.
main = "./src/worker.ts"
compatibility_date = "2026-09-02"
# The Worker runs Node built-ins (WebCrypto helpers, Buffer in the image path).
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Prerendered HTML, hashed assets and fonts are served from the static asset store; the Worker only
# runs for /admin/**, /api/** and /img/**.
#
# `./dist/client`, not `./dist`: @astrojs/cloudflare v14 splits the build into `dist/client` (public
# assets) and `dist/server` (the Worker bundle). Pointing this at `./dist` would place the server
# bundle inside the uploaded asset tree. `public/.assetsignore` is a second line of defence.
[assets]
binding = "ASSETS"
directory = "./dist/client"
# Trailing slashes are normalised away at the edge (Requirement 23.15); src/middleware.ts applies the
# same rule to Worker-served routes and to `astro dev`.
html_handling = "drop-trailing-slash"

# --- Scheduled work ---------------------------------------------------------
# The scheduled handler exists in source, but production scheduling is disabled.
# Keep crons empty; do not enable analytics scheduling.
[triggers]
crons = []

[observability]
enabled = true

[placement]
mode = "smart"

# --- Public (non-secret) variables ------------------------------------------
# These are printed on the site itself, so they are configuration, not secrets.
[vars]
PUBLIC_SITE_URL = "https://newgalaxyfurniture.newgalaxyfurnitures-in.workers.dev"
GITHUB_REPO = "newgalaxyfurnituresin-hub/NewGalaxyFurniture.in"
GITHUB_BRANCH = "main"
CF_WORKER_NAME = "newgalaxyfurniture"
CF_ACCESS_TEAM_DOMAIN = "https://winter-firefly-d5dd.cloudflareaccess.com"
CF_ACCESS_AUD = "5490a1a64c3f09635f1442a0a2dbec2f3f4791470971bd8ff414eccda031278b"
PUBLIC_WHATSAPP_NUMBERS = "+919513443606,+918147083703"
PUBLIC_PHONE_NUMBERS = "+919513443606,+918147083703"

# --- KV ---------------------------------------------------------------------
# SESSIONS:  opaque admin sessions at session:{id}, 12 h TTL.
# DRAFTS:    draft product JSON at draft:{id} for instant /admin/preview.
# RATELIMIT: fixed-window counters for every rate limit (login windows, hourly AI/lead caps,
#            10-minute upload caps, and the per-minute admin-API / events ceilings).
[[kv_namespaces]]
binding = "SESSIONS"
id = "5faf6b288c98463cb21fb4609df2c61a"

[[kv_namespaces]]
binding = "DRAFTS"
id = "abe3026fdaa049d3b7a8a1973405c897"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "d8b27da909f442189d7dd63f4c922706"

# --- D1 ---------------------------------------------------------------------
# Leads, analytics events and daily rollups, admin users, login attempts.
# Apply the SQLite migrations in ./migrations before first use (see migrations/README.md).
[[d1_databases]]
binding = "DB"
database_name = "ngf-content"
database_id = "0727a2b8-4791-4708-a84b-4b8eff033342"
migrations_dir = "migrations"

# --- R2 ---------------------------------------------------------------------
# Image originals and generated derivatives, served through /img/**.
#
# The 30-day recovery window for deleted images (Requirement 15.16) is an R2 bucket lifecycle rule,
# which wrangler.toml cannot express. Set it once per bucket:
#     wrangler r2 bucket lifecycle add ngf-media --name expire-deleted --prefix deleted/ --expire-days 30
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ngf-media"

# ----------------------------------------------------------------------------
# Preview environment: PR deployments. Distinct PUBLIC_SITE_URL so preview content never leaks into
# canonical tags or gets indexed (Requirement 28.2). Preview resources are to be treated as EMPTY;
# no production data is migrated into them.
#
# SELECT THIS ENVIRONMENT AT BUILD TIME, NOT AT DEPLOY TIME:
#     CLOUDFLARE_ENV=preview npm run build && wrangler deploy
# ----------------------------------------------------------------------------
[env.preview]
name = "new-galaxy-furniture-preview"
workers_dev = true

# NO CRON ON PREVIEW. `triggers` is inheritable, so this empty list is required to stop the preview
# Worker inheriting the nightly schedule and committing a snapshot computed from preview data into
# the production content repository.
[env.preview.triggers]
crons = []

[env.preview.vars]
PUBLIC_SITE_URL = "https://preview.newgalaxyfurniture.workers.dev"
PUBLIC_WHATSAPP_NUMBERS = "+919513443606,+918147083703"
PUBLIC_PHONE_NUMBERS = "+919513443606,+918147083703"

[env.preview.assets]
binding = "ASSETS"
directory = "./dist/client"
html_handling = "drop-trailing-slash"

[[env.preview.kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_COMPANY_PREVIEW_SESSIONS_ID"

[[env.preview.kv_namespaces]]
binding = "DRAFTS"
id = "REPLACE_WITH_COMPANY_PREVIEW_DRAFTS_ID"

[[env.preview.kv_namespaces]]
binding = "RATELIMIT"
id = "REPLACE_WITH_COMPANY_PREVIEW_RATELIMIT_ID"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ngf-content-preview"
database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "ngf-media-preview"
